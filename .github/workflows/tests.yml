name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Ensure Poetry is installed
        run: |
          if ! command -v poetry &> /dev/null; then
            pipx install poetry
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest --disruptive-tests --cov=gli4py --cov-report=term-missing --cov-report=xml

      - name: Verify documentation and mock completeness
        run: poetry run python .github/scripts/check_completeness.py

      - name: Verify package build
        run: poetry build --no-interaction
