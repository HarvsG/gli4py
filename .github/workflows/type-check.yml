name: Type Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typing:
    name: Type Check & Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Poetry is installed
        run: |
          if ! command -v poetry &> /dev/null; then
            pipx install poetry
          fi

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Mypy Strict
        run: poetry run mypy --strict gli4py

      - name: Run API Type Compliance Test
        run: poetry run pytest tests/test_type_compliance.py
