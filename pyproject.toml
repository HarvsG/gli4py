[tool.poetry]
name = "gli4py"
version = "0.0.18-beta.1"
description = "A python 3 API wrapper for GL-inet routers for consumption by Home Assistant"
authors = ["HarvsG <doctor@codingdoctor.co.uk>"]
license = "GNU GENERAL PUBLIC LICENSE"
readme = "README.md"
packages = [{include = "gli4py"}]

[tool.poetry.scripts]
gli-enumerate = "gli4py.enumeration:main"

[tool.poetry.dependencies]
python = "^3.11"
uplink = "0.10.0"
libpass = "^1.8.0"
semver = "^3.0.0"

[tool.poetry.group.dev.dependencies]
requests = "^2.27.1"
aiohttp = "^3.8.4"
json2json = "^0.1.0"
pytest = ">=7.2.2"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.9.0"
pre-commit = ">=4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that require a physical GL.iNet router at 192.168.0.1 (deselect with '-m \"not live\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
combine-as-imports = true
